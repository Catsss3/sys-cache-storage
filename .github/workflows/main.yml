name: Blondie-Auto-Scanner
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Python script
        run: python scanner.py
      - name: Commit and push changes
        run: |
          git config --global user.name "Blondie-Bot"
          git config --global user.email "bot@stella.ai"
          git add live_configs.txt telegram_channels.json
          git commit -m "👱‍♀️ Stella: Авто-обновление конфигов ✨" || exit 0
          git push origin main
