name: Blondie-Auto-Scanner

on:
  schedule:
    - cron: '0 */12 * * *'   # Каждые 12 часов
  workflow_dispatch:          # Ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0      # Полная история для стабильного push

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'        # Кэширование библиотек для скорости ⚡

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner script
        run: python scanner.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Blondie-Bot"
          git config --global user.email "bot@stella.ai"

          # Проверяем, изменился ли файл с конфигами
          if git diff --quiet live_configs.txt; then
            echo "✨ Изменений в live_configs.txt не обнаружено. Завершаю."
          else
            git add live_configs.txt
            git commit -m "👱‍♀️ Stella: Авто‑обновление элитных конфигов ✨"
            # Используем force-with-lease для безопасности, если были ручные правки
            git push origin HEAD:main
          fi
