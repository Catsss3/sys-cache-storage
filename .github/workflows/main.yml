name: Blondie-Auto-Scanner

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # Убрала cache: 'pip', так как у нас нет файла requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner script
        run: python scanner.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Blondie-Bot"
          git config --global user.email "bot@stella.ai"

          # Проверяем наличие файла перед диффом, чтобы не упасть
          if [ -f live_configs.txt ]; then
            if git diff --quiet live_configs.txt; then
              echo "✨ Изменений не обнаружено."
            else
              git add live_configs.txt
              git commit -m "👱‍♀️ Stella: Авто‑обновление элитных конфигов ✨"
              git push origin HEAD:main
            fi
          else
            # Если файла еще нет, просто добавляем его
            git add live_configs.txt
            git commit -m "👱‍♀️ Stella: Первая инициализация конфигов ✨"
            git push origin HEAD:main
          fi
